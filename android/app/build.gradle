import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
    }
}

android {
    namespace 'com.pektv.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pektv.app'
        minSdk 26
        // 36 = Android 16, the level Google Play requires for new apps and
        // updates from Aug 31, 2026.
        targetSdk 36
        versionCode 16   // bump this by 1 for every release you publish
        // CI passes -PpekVersionName=<tag>; local builds use 2.1.5
        versionName (project.hasProperty('pekVersionName') ? project.property('pekVersionName') : '2.1.5')

        // No ndk.abiFilters here: the CPU types are chosen by the splits block below (Gradle refuses both together).
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                // -PpekTorrent=true or the older -PhesperTorrent=true (set by the workflow) builds in torrent streaming.
                arguments "-DPEK_TORRENT=${((project.hasProperty('pekTorrent') && project.property('pekTorrent') == 'true') || (project.hasProperty('hesperTorrent') && project.property('hesperTorrent') == 'true')) ? 'ON' : 'OFF'}"
            }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    // One APK per CPU type instead of one fat APK holding both (Flutter, libmpv, Python and the torrent code were packed twice).
    //   arm64-v8a    64-bit: nearly every phone, and current TVs and boxes
    //   armeabi-v7a  32-bit: older phones and the many Android TV sticks that still run a 32-bit system
    // No universal APK on purpose: that would be the big file again.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    // Release signing: CI supplies these as environment variables (from GitHub secrets).
    // With none set (e.g. a local assembleRelease) the release build is signed with the
    // debug key so it still installs - never publish one of those.
    def pekKs = System.getenv('PEK_KEYSTORE_FILE')
    signingConfigs {
        if (pekKs) {
            release {
                storeFile file(pekKs)
                storePassword System.getenv('PEK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PEK_KEY_ALIAS')
                keyPassword System.getenv('PEK_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Installs NEXT TO the beta (different app id) so you can keep both.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
            // Debug builds both armeabi-v7a (32-bit) and arm64-v8a (64-bit), same as release.
        }
        release {
            debuggable false
            // R8 off for the first beta: the JNI bridge and Chaquopy are easy to break with shrinking.
            minifyEnabled false
            shrinkResources false
            signingConfig pekKs ? signingConfigs.release : signingConfigs.debug
            if (!pekKs) logger.warn('WARNING: PEK_KEYSTORE_FILE not set - release signed with DEBUG key')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Each CPU build needs its own versionCode (an install must never replace a 64-bit build with a 32-bit one or the reverse).
// 64-bit gets the higher number, which is what stores and sideload updaters prefer when a device could run both.
// Example: versionCode 16 -> 161 (32-bit) and 162 (64-bit).
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abi = output.getFilter('ABI')
        def offset = abi == 'arm64-v8a' ? 2 : (abi == 'armeabi-v7a' ? 1 : 0)
        output.versionCodeOverride = android.defaultConfig.versionCode * 10 + offset
    }
}

// Chaquopy: embedded Python so plugins/<name>/backend.py runs on Android.
// 3.11 is the newest Python that still ships 32-bit (armeabi-v7a) builds.
chaquopy {
    defaultConfig {
        version = "3.11"
    }
}

// Flutter UI: only wired in when the module has been generated (see settings.gradle).
def flutterOn = new File(rootDir, '../flutter_ui/.android/include_flutter.groovy').exists()
if (flutterOn) {
    android.sourceSets.main.java.srcDir 'src/flutter/java'
}

dependencies {
    if (flutterOn) {
        implementation project(':flutter')
    }
    // mpv engine: the app's only video player (decoding + rendering)
    implementation 'dev.jdtech.mpv:libmpv:1.0.0'
}
