import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
    }
}

android {
    namespace 'com.hesper.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hesper.app'
        minSdk 26
        // 28 keeps old-style storage access working for reading media
        // folders; this app is sideloaded, not on Play.
        targetSdk 28
        versionCode 1
        versionName '0.1.0'

        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17' }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // mpv engine: the app's only video player (decoding + rendering)
    implementation 'dev.jdtech.mpv:libmpv:1.0.0'
}
