plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hesper.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hesper.app'
        minSdk 21
        // 28 keeps old-style storage access working for reading media
        // folders; this app is sideloaded, not on Play.
        targetSdk 28
        versionCode 1
        versionName '0.1.0'

        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17' }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
