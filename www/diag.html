<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEK TV Diagnostics</title>
<style>body{background:#111;color:#eee;font:14px monospace;padding:14px}h2{color:#58a6ff;margin:14px 0 6px}.ok{color:#3fb950}.bad{color:#ff6b6b}pre{white-space:pre-wrap;word-break:break-all;margin:0}button{padding:10px 14px;margin:6px 6px 0 0}</style>
</head><body>
<h1>PEK TV Diagnostics</h1>
<div id="out"></div>
<button onclick="try{localStorage.clear()}catch(e){};location.href='/?reset=1'">Reset saved settings &amp; open app</button>
<button onclick="location.href='/'">Open app</button>
<script>
const out = document.getElementById('out');
const add = (cls, t) => { const d = document.createElement('pre'); d.className = cls; d.textContent = t; out.appendChild(d); };
const head = t => { const h = document.createElement('h2'); h.textContent = t; out.appendChild(h); };

(async () => {
  head('Browser');
  add('', navigator.userAgent);

  head('Files served by the server');
  for (const f of ['index.html', 'hesperframework.js', 'app.js', 'style.css']) {
    try {
      const r = await fetch('/' + f + '?d=' + Date.now(), { cache: 'no-store' });
      const t = await r.text();
      let extra = '';
      if (f === 'index.html') extra = t.includes('display: none; position: fixed') ? ' [new: overlay hidden]' : ' [OLD index.html]';
      if (f === 'app.js') extra = t.includes("HESPER_APP_BUILD = 'v5'") ? ' [new: build v5]' : ' [OLD app.js]';
      if (f === 'hesperframework.js') extra = t.includes('hesperThemeUnreadable') ? ' [new]' : ' [OLD framework]';
      if (f === 'style.css') extra = t.includes('max-width: 720px') ? ' [new: mobile layout]' : ' [OLD style.css]';
      add(r.ok ? 'ok' : 'bad', `${f}: HTTP ${r.status}, ${t.length} bytes${extra}`);
    } catch (e) { add('bad', `${f}: failed (${e.message})`); }
  }

  head('API');
  for (const u of ['/api/plugins', '/api/sources', '/api/movies']) {
    try { const r = await fetch(u); add(r.ok ? 'ok' : 'bad', `${u}: HTTP ${r.status} ${(await r.text()).slice(0, 120)}`); }
    catch (e) { add('bad', `${u}: failed (${e.message})`); }
  }

  head('Saved settings (localStorage)');
  try {
    const keys = Object.keys(localStorage);
    add('', keys.length ? keys.map(k => `${k} = ${localStorage.getItem(k).slice(0, 160)}`).join('\n') : '(empty)');
  } catch (e) { add('bad', 'localStorage unavailable: ' + e.message); }

  head('Live app check (loads the real app in a hidden frame)');
  const fr = document.createElement('iframe');
  fr.style.cssText = 'width:360px;height:600px;position:absolute;left:-9999px';
  fr.src = '/?d=' + Date.now();
  document.body.appendChild(fr);
  fr.onload = () => setTimeout(() => {
    try {
      const w = fr.contentWindow, d = fr.contentDocument;
      const app = d.getElementById('app');
      const shell = d.querySelector('.hesper-shell');
      const cs = w.getComputedStyle(d.body);
      add(app && app.children.length ? 'ok' : 'bad', `#app children: ${app ? app.children.length : 'no #app'}`);
      add('', `HesperEngine: ${w.eval('typeof HesperEngine')}, MainApp: ${w.eval('typeof MainApp')}, build: ${w.HESPER_APP_BUILD}`);
      add('', `body color: ${cs.color}, background: ${cs.backgroundColor}`);
      if (shell) { const r = shell.getBoundingClientRect(); add('', `shell size: ${Math.round(r.width)}x${Math.round(r.height)}`); }
      const err = d.getElementById('debug-logs');
      add('', 'error log: ' + (err && err.textContent.trim() ? err.textContent.trim().slice(0, 600) : '(none)'));
    } catch (e) { add('bad', 'frame check failed: ' + e.message); }
  }, 2500);
})();
</script>
</body></html>
