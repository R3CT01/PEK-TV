<style>
#hesper-splash{position:fixed;inset:0;z-index:2147483647;background:#E9E2DA;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
#hesper-splash.out{opacity:0;pointer-events:none}
#hesper-splash video{width:100%;height:100%;object-fit:cover}
</style>

<body>
<div id="hesper-splash"><video muted playsinline preload="auto"></video></div>
<script>
// Splash: plays once per session; tap/key skips. Skipped inside the Android app,
// which plays the same video natively before the WebView loads.
(function () {
  var el = document.getElementById('hesper-splash');
  var seen = false;
  try { seen = sessionStorage.getItem('hesperSplash') === '1'; } catch (e) {}
  if (window.HesperAndroid || seen) { el.remove(); return; }
  try { sessionStorage.setItem('hesperSplash', '1'); } catch (e) {}
  var v = el.querySelector('video'), gone = false;
  // Portrait screens (phones) get the 9:16 cut; wide screens (TVs, desktops) the 16:9 one.
  v.src = window.matchMedia('(orientation: portrait)').matches ? 'splash_portrait.mp4' : 'splash.mp4';
  function end() {
    if (gone) return; gone = true;
    el.classList.add('out');
    setTimeout(function () { el.remove(); }, 600);
  }
  v.addEventListener('ended', end);
  v.addEventListener('error', end);
  el.addEventListener('click', end);
  document.addEventListener('keydown', end, { once: true });
  setTimeout(end, 8000);               // safety net
  var p = v.play(); if (p && p.catch) p.catch(end);
})();
</script>
<script>
