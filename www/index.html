<div id="pek-splash"><video muted playsinline preload="auto"></video></div>
<script>
// Splash: plays once per session and can't be skipped - clicks, taps and keys are blocked until the video
// ends. The app keeps loading underneath it. Skipped inside the Android app, which plays the same video
// natively (SplashOverlay.kt) with the same lock.
(function () {
  var el = document.getElementById('pek-splash');
  var seen = false;
  try { seen = sessionStorage.getItem('pekSplash') === '1'; } catch (e) {}
  if (window.PekAndroid || seen) { el.remove(); return; }
  try { sessionStorage.setItem('pekSplash', '1'); } catch (e) {}
  var v = el.querySelector('video'), gone = false, videoDone = false, net;
  // Portrait screens (phones) get the 9:16 cut; wide screens (TVs, desktops) the 16:9 one.
  v.src = window.matchMedia('(orientation: portrait)').matches ? 'splash_portrait.mp4' : 'splash.mp4';

  // Lock: swallow keys (so nothing behind the splash can be focused or activated) and gestures.
  function lock(e) { e.preventDefault(); e.stopImmediatePropagation(); }
  var lockEvents = ['keydown', 'keyup', 'keypress', 'wheel', 'touchmove', 'contextmenu'];
  lockEvents.forEach(function (n) { window.addEventListener(n, lock, { capture: true, passive: false }); });

  function end() {
    if (gone) return; gone = true;
    clearTimeout(net);
    lockEvents.forEach(function (n) { window.removeEventListener(n, lock, { capture: true }); });
    el.classList.add('out');
    setTimeout(function () { el.remove(); }, 600);
  }
  // Video finished: leave as soon as the page has loaded too (hold the last frame up to 6 s if it is slow).
  function videoEnded() {
    if (videoDone) return; videoDone = true;
    if (document.readyState === 'complete') { end(); return; }
    window.addEventListener('load', end, { once: true });
    clearTimeout(net); net = setTimeout(end, 6000);
  }
  v.addEventListener('ended', videoEnded);
  v.addEventListener('error', videoEnded);   // a broken video must never block the app
  // Safety nets only: if it never starts, or stalls part-way.
  net = setTimeout(videoEnded, 15000);
  v.addEventListener('playing', function () {
    clearTimeout(net); net = setTimeout(videoEnded, ((v.duration || 5) + 3) * 1000);
  });
  var p = v.play(); if (p && p.catch) p.catch(videoEnded);
})();
</script>
