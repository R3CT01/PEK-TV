name: Build Android APK

on:
  push:
    branches: [android]
  workflow_dispatch:   # adds a manual "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # OpenSSL takes a few minutes to compile, so it is cached and
      # only rebuilt if the script changes.
      - name: Cache OpenSSL
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: android/openssl
          key: openssl-${{ hashFiles('android/scripts/build-openssl.sh') }}

      - name: Build OpenSSL for Android
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: bash android/scripts/build-openssl.sh

      - name: Copy the web frontend into the app
        run: |
          mkdir -p android/app/src/main/assets/hesper
          cp -r www skins plugins android/app/src/main/assets/hesper/
          find android/app/src/main/assets -name __pycache__ -type d -exec rm -rf {} +
          curl -fsSL https://curl.se/ca/cacert.pem -o android/app/src/main/assets/hesper/cacert.pem

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesper-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
