name: Build PEK TV (Android)

# Tag push  (v0.1.3-beta.1)  -> signed RELEASE apk + GitHub pre-release
# Manual run (Actions tab / gh) -> pick debug or release, optional publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug = fast, installs next to the beta | release = signed beta apk'
        type: choice
        options: [debug, release]
        default: debug
      torrent:
        description: 'Build in torrent streaming (libtorrent) - needed for stream playback'
        type: boolean
        default: true
      publish:
        description: 'Release builds only: also publish a GitHub pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_TYPE: ${{ github.event_name == 'push' && 'release' || inputs.build_type }}
      WANT_TORRENT: ${{ github.event_name == 'workflow_dispatch' && inputs.torrent || github.event_name == 'push' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repo has no Gradle wrapper, so install Gradle here (AGP 8.7 needs >= 8.9).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      # Gradle's own NDK auto-download can hand back a corrupt zip ("Error on ZipFile unknown archive").
      # Install the exact NDK AGP asks for ourselves, with retries, and wipe any half-downloaded copy first.
      - name: Install NDK (with retry)
        run: |
          NDK=27.0.12077973
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3 4; do
            rm -rf "$ANDROID_HOME/ndk/$NDK"
            "$SM" "ndk;$NDK" && [ -f "$ANDROID_HOME/ndk/$NDK/source.properties" ] && { echo "NDK ok"; exit 0; }
            echo "NDK install attempt $i failed, retrying..."; sleep 10
          done
          echo "::error::Could not install NDK $NDK"; exit 1

      # ---- Version -------------------------------------------------------
      - name: Work out version name
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(grep -oP "versionName.*: '\K[^']+" android/app/build.gradle)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "Version: $V  (type: $BUILD_TYPE)"

      # ---- Flutter UI (only when flutter_ui/ is in the repo) ---------------
      - name: Set up Flutter
        if: ${{ hashFiles('flutter_ui/pubspec.yaml') != '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Flutter module
        if: ${{ hashFiles('flutter_ui/pubspec.yaml') != '' }}
        working-directory: flutter_ui
        run: flutter pub get

      - name: Patch plugins using removed flutter.compileSdkVersion
        if: ${{ hashFiles('flutter_ui/pubspec.yaml') != '' }}
        run: |
          grep -rl "flutter.compileSdkVersion" "$PUB_CACHE/hosted" --include=build.gradle.kts --include=build.gradle 2>/dev/null \
            | xargs -r sed -i 's/flutter\.compileSdkVersion/36/g'

      # ---- Bundle the web UI, plugins and skins into the apk -------------
      - name: Stage app assets
        run: |
          A=android/app/src/main/assets/hesper
          mkdir -p "$A"
          cp -r plugins skins "$A/"
          curl -fsSL https://curl.se/ca/cacert.pem -o "$A/cacert.pem"
          find "$A" -name __pycache__ -type d -prune -exec rm -rf {} +
          rm -rf "$A"/plugins/*/data

      # ---- Native dependencies -------------------------------------------
      - name: Cache OpenSSL
        id: ossl
        uses: actions/cache@v4
        with:
          path: android/openssl
          key: openssl-${{ hashFiles('android/scripts/build-openssl.sh') }}

      - name: Build OpenSSL
        if: steps.ossl.outputs.cache-hit != 'true'
        run: bash android/scripts/build-openssl.sh

      - name: Cache SQLite
        uses: actions/cache@v4
        with:
          path: android/sqlite
          key: sqlite-${{ hashFiles('android/scripts/fetch-sqlite.sh') }}

      # Runs EVERY build (not only on a cache miss). The script is a no-op when valid sqlite3.c/.h are already
      # there, and re-downloads if the cache restored an empty or damaged copy.
      - name: Ensure SQLite (library and music databases)
        run: bash android/scripts/fetch-sqlite.sh

      - name: Verify SQLite before building
        run: |
          for f in sqlite3.c sqlite3.h; do
            [ -s "android/sqlite/$f" ] || { echo "::error::android/sqlite/$f is missing or empty"; exit 1; }
          done
          grep -m1 '#define SQLITE_VERSION ' android/sqlite/sqlite3.h

      - name: Clone libsmb2 (SMB shares)
        continue-on-error: true
        run: git clone --depth 1 https://github.com/sahlberg/libsmb2 android/libsmb2

      - name: Clone libtorrent + Boost headers
        if: env.WANT_TORRENT == 'true'
        run: |
          git clone --depth 1 --branch RC_2_0 --recurse-submodules --shallow-submodules \
            https://github.com/arvidn/libtorrent android/libtorrent
          # NOTE: must be the b2 (classic) tarball: it has boost/version.hpp at its top level, which CMakeLists.txt
          # checks for. The "-cmake" tarball keeps headers under libs/*/include, so torrents were silently built OFF.
          curl -fsSL https://github.com/boostorg/boost/releases/download/boost-1.86.0/boost-1.86.0-b2-nodocs.tar.gz \
            | tar xz -C android
          mv android/boost-1.86.0 android/boost
          test -f android/boost/boost/version.hpp || { echo "::error::Boost headers not where CMake expects them"; exit 1; }

      # ---- Signing (release only) ----------------------------------------
      - name: Check signing secrets
        if: env.BUILD_TYPE == 'release'
        env:
          KS: ${{ secrets.PEK_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.PEK_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.PEK_KEY_ALIAS }}
          KP: ${{ secrets.PEK_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v - see the setup guide (PEK_KEYSTORE_BASE64 / _PASSWORD / PEK_KEY_ALIAS / PEK_KEY_PASSWORD)"; exit 1; }
          done
          echo "$KS" | base64 -d > "$RUNNER_TEMP/pek-release.jks"
          echo "PEK_KEYSTORE_FILE=$RUNNER_TEMP/pek-release.jks" >> "$GITHUB_ENV"
          echo "PEK_KEYSTORE_PASSWORD=$KSP" >> "$GITHUB_ENV"
          echo "PEK_KEY_ALIAS=$KA" >> "$GITHUB_ENV"
          echo "PEK_KEY_PASSWORD=$KP" >> "$GITHUB_ENV"

      # ---- Build ---------------------------------------------------------
      - name: Build APK
        working-directory: android
        run: |
          TASK=$([ "$BUILD_TYPE" = release ] && echo assembleRelease || echo assembleDebug)
          COMMON="-PpekVersionName=$VERSION_NAME --stacktrace -Dorg.gradle.jvmargs=-Xmx4g"
          T=""
          if [ "$WANT_TORRENT" = true ]; then
            [ -f libtorrent/CMakeLists.txt ] || { echo "::error::libtorrent missing - cannot build torrent support"; exit 1; }
            T="-PpekTorrent=true"
          fi

          # One build per CPU type (Chaquopy needs ndk.abiFilters, which can't be combined with APK splits).
          mkdir -p ../dist
          for ABI in arm64-v8a armeabi-v7a; do
            echo "::group::Build $ABI"
            if ! gradle $TASK $COMMON $T -PpekAbi=$ABI; then
              if [ "$WANT_TORRENT" = true ]; then
                # Do NOT silently drop torrents: that produces the "cannot play torrents" apk.
                echo "::warning::Full build failed - retrying without SMB but KEEPING torrent"
                rm -rf libsmb2 app/.cxx app/build
                gradle $TASK $COMMON $T -PpekAbi=$ABI
              else
                echo "::warning::Full build failed - retrying without optional native libs"
                rm -rf libsmb2 libtorrent boost app/.cxx app/build
                gradle $TASK $COMMON -PpekAbi=$ABI
              fi
            fi
            SRC=$(ls app/build/outputs/apk/$BUILD_TYPE/*.apk 2>/dev/null | head -1)
            [ -n "$SRC" ] || { echo "::error::No $ABI apk was built"; exit 1; }
            cp "$SRC" "../dist/PEK-TV-${VERSION_NAME}-${BUILD_TYPE}-${ABI}.apk"
            rm -rf app/build/outputs/apk
            echo "::endgroup::"
          done

      # Two APKs come out of the build: one 64-bit (arm64-v8a) and one 32-bit (armeabi-v7a).
      - name: Verify apks
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for ABI in arm64-v8a armeabi-v7a; do
            OUT="dist/PEK-TV-${VERSION_NAME}-${BUILD_TYPE}-${ABI}.apk"
            [ -f "$OUT" ] || { echo "::error::$OUT missing"; exit 1; }
            if [ "$WANT_TORRENT" = true ]; then
              # The stub in torrent.cpp contains this text; a real libtorrent build does not.
              TMP=$(mktemp -d); unzip -q -o "$OUT" 'lib/*/libpek.so' -d "$TMP"
              for so in "$TMP"/lib/*/libpek.so; do
                if strings "$so" | grep -q "Torrent support is not built into this PEK TV"; then
                  echo "::error::$so ($ABI) was built WITHOUT libtorrent (stub). Not publishing."; exit 1
                fi
              done
              echo "Torrent engine verified in $ABI apk"
            fi
            "$APKSIGNER" verify --print-certs "$OUT" | head -5
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: PEK-TV-${{ env.VERSION_NAME }}-${{ env.BUILD_TYPE }}
          path: dist/*.apk
          retention-days: 30

      # ---- Publish -------------------------------------------------------
      - name: GitHub pre-release
        if: env.BUILD_TYPE == 'release' && (github.event_name == 'push' || inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', env.VERSION_NAME) }}
          name: PEK TV ${{ env.VERSION_NAME }}
          prerelease: true
          generate_release_notes: true
          files: dist/*.apk

