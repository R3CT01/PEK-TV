name: pek_tv_ui
description: PEK TV Flutter UI (Android first). Talks to the existing C++ server on 127.0.0.1:8080 and drives libmpv through platform channels.
publish_to: none
version: 2.1.8+17

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  webview_flutter: ^4.10.0          # plugin trailers (YouTube, locked to youtube-nocookie.com)
  webview_flutter_android: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  module:
    androidX: true
    androidPackage: com.pektv.app.flutterui
    iosBundleIdentifier: com.pektv.app.flutterui
